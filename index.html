<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game of Life</title>
<style>
    * { -webkit-tap-highlight-color: transparent; }
  body { background:#000; color:#0f0; font-family:system-ui,monospace; margin:0; padding:8px; }
  canvas { border:1px solid #0f0; width:100%; max-width:500px; display:block; margin:8px auto; }
 .btn { background:#111; color:#0f0; border:1px solid #0f0; padding:12px 8px; margin:2px; font-size:15px; border-radius:4px; }
 .btn:active { background:#0f0; color:#000; }
  #ui { display:flex; flex-wrap:wrap; justify-content:center; }
  #stats { text-align:center; margin:8px; font-size:14px; }
</style>
</head>
<body>
<div id="ui">
  <button class="btn" id="btnPlay">Start</button>
  <button class="btn" id="btnStep">Step</button>
  <button class="btn" id="btnClear">Clear</button>
  <button class="btn" id="btnRandom">Random</button>
  <button class="btn" id="btnPandemic">Pandemie</button>
  <button class="btn" id="btnGlider">Glider</button>
  <button class="btn" id="btnGun">Gun</button>
</div>
<div id="stats">Gen: 0 | Lebend: 0</div>
<canvas id="c" width="400" height="400"></canvas>

<script>
(function() {
  // iOS 26 braucht expliziten strict mode + IIFE wrapper
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var CELL = 10;
  var cols = 40, rows = 40;
  var grid = [];
  var running = false;
  var gen = 0;
  var lastTime = 0;

  function initGrid() {
    grid = new Array(rows);
    for(var y=0; y<rows; y++) {
      grid[y] = new Array(cols);
      for(var x=0; x<cols; x++) {
        grid[y][x] = 0;
      }
    }
    gen = 0;
  }

  function getNeighbors(x,y) {
    var count = 0;
    for(var dy=-1; dy<=1; dy++) {
      for(var dx=-1; dx<=1; dx++) {
        if(dx===0 && dy===0) continue;
        var nx = x+dx, ny = y+dy;
        if(nx>=0 && nx<cols && ny>=0 && ny<rows) {
          count += grid[ny][nx];
        }
      }
    }
    return count;
  }

  function step() {
    var next = new Array(rows);
    for(var y=0; y<rows; y++) {
      next[y] = new Array(cols);
      for(var x=0; x<cols; x++) {
        var n = getNeighbors(x,y);
        next[y][x] = (n===3 || (grid[y][x]===1 && n===2))? 1 : 0;
      }
    }
    grid = next;
    gen++;
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#00ff00';
    for(var y=0; y<rows; y++) {
      for(var x=0; x<cols; x++) {
        if(grid[y][x]===1) {
          ctx.fillRect(x*CELL, y*CELL, CELL-1, CELL-1);
        }
      }
    }
    document.getElementById('stats').textContent = 'Gen: ' + gen + ' | Lebend: ' + countAlive();
  }

  function countAlive() {
    var sum = 0;
    for(var y=0; y<rows; y++) {
      for(var x=0; x<cols; x++) sum += grid[y][x];
    }
    return sum;
  }

  function gameLoop(timestamp) {
    if(running && timestamp - lastTime > 100) {
      step();
      lastTime = timestamp;
    }
    draw();
    window.requestAnimationFrame(gameLoop);
  }

  function handlePointer(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches? e.touches[0].clientX : e.clientX;
    var clientY = e.touches? e.touches[0].clientY : e.clientY;
    var x = Math.floor((clientX - rect.left) / (rect.width / cols));
    var y = Math.floor((clientY - rect.top) / (rect.height / rows));
    if(x>=0 && x<cols && y>=0 && y<rows) {
      grid[y][x] = 1 - grid[y][x];
      draw();
    }
  }

  // Event Listener statt onclick - iOS 26 Pflicht
  document.getElementById('btnPlay').addEventListener('click', function() {
    running =!running;
    this.textContent = running? 'Pause' : 'Start';
  });

  document.getElementById('btnStep').addEventListener('click', function() {
    running = false;
    document.getElementById('btnPlay').textContent = 'Start';
    step(); draw();
  });

  document.getElementById('btnClear').addEventListener('click', function() {
    running = false;
    document.getElementById('btnPlay').textContent = 'Start';
    initGrid(); draw();
  });

  document.getElementById('btnRandom').addEventListener('click', function() {
    initGrid();
    for(var y=0; y<rows; y++) {
      for(var x=0; x<cols; x++) {
        if(Math.random() < 0.25) grid[y][x] = 1;
      }
    }
    draw();
  });

  document.getElementById('btnPandemic').addEventListener('click', function() {
    for(var y=0; y<rows; y++) {
      for(var x=0; x<cols; x++) {
        if(grid[y][x]===1 && Math.random() < 0.35) grid[y][x] = 0;
      }
    }
    draw();
  });

  document.getElementById('btnGlider').addEventListener('click', function() {
    initGrid();
    var pattern = [[1,0],[2,1],[0,2],[1,2],[2,2]];
    var ox = 18, oy = 18;
    for(var i=0; i<pattern.length; i++) {
      grid[oy+pattern[i][1]][ox+pattern[i][0]] = 1;
    }
    draw();
  });

  document.getElementById('btnGun').addEventListener('click', function() {
    initGrid();
    var p = [[1,5],[1,6],[2,5],[2,6],[11,5],[11,6],[11,7],[12,4],[12,8],[13,3],[13,9],[14,3],[14,9],[15,6],[16,4],[16,8],[17,5],[17,6],[17,7],[18,6],[21,3],[21,4],[21,5],[22,3],[22,4],[22,5],[23,2],[23,6],[25,1],[25,2],[25,6],[25,7],[35,3],[35,4],[36,3],[36,4]];
    for(var i=0; i<p.length; i++) {
      if(p[i][1]<rows && p[i][0]<cols) grid[p[i][1]][p[i][0]] = 1;
    }
    draw();
  });

  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handlePointer(e); }, {passive: false});
  canvas.addEventListener('mousedown', handlePointer);

  initGrid();
  window.requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
