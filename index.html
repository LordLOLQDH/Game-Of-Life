<!DOCTYPE html>
<html>
<head>
<style>
  body { background:#111; color:#0f8; font-family:monospace; margin:0; text-align:center; }
  canvas { border:1px solid #0f8; margin-top:10px; }
  button,select { background:#222; color:#0f8; border:1px solid #0f8; margin:4px; padding:6px 10px; }
  button:hover { background:#0f8; color:#111; cursor:pointer; }
  #ui { margin:10px; }
</style>
</head>
<body>
<div id="ui">
  <button id="play">Start</button>
  <button id="step">Step</button>
  <button id="clear">Clear</button>
  <button id="random">Random 20%</button>
  <button id="pandemic">Pandemie 💀</button>
  <select id="presets">
    <option value="">-- Struktur laden --</option>
    <option value="glider">Glider</option>
    <option value="gun">Gosper Glider Gun</option>
    <option value="pulsar">Pulsar</option>
    <option value="r">R-Pentomino</option>
    <option value="lwss">Lightweight Spaceship</option>
  </select>
  <span id="stats">Gen: 0 | Lebend: 0</span>
</div>
<canvas id="c" width="1200" height="700"></canvas>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let CELL = 8; // Start-Größe, wird bei großen Strukturen kleiner
let cols = Math.floor(c.width/CELL), rows = Math.floor(c.height/CELL);
let g = Array(rows).fill().map(()=>Array(cols).fill(0));
let running = false, gen = 0;

// Presets als Koordinaten-Listen. 1 = lebend
const PRESETS = {
  glider: [[1,0],[2,1],[0,2],[1,2],[2,2]],
  lwss: [[1,0],[4,0],[0,1],[0,2],[4,2],[0,3],[1,3],[2,3],[3,3]],
  r: [[1,0],[2,0],[0,1],[1,1],[1,2]],
  pulsar: [
    [2,0],[3,0],[4,0],[8,0],[9,0],[10,0],
    [0,2],[5,2],[7,2],[12,2],[0,3],[5,3],[7,3],[12,3],[0,4],[5,4],[7,4],[12,4],
    [2,5],[3,5],[4,5],[8,5],[9,5],[10,5],[2,7],[3,7],[4,7],[8,7],[9,7],[10,7],
    [0,8],[5,8],[7,8],[12,8],[0,9],[5,9],[7,9],[12,9],[0,10],[5,10],[7,10],[12,10],
    [2,12],[3,12],[4,12],[8,12],[9,12],[10,12]
  ],
  gun: [
    [1,5],[1,6],[2,5],[2,6],[11,5],[11,6],[11,7],[12,4],[12,8],[13,3],[13,9],[14,3],[14,9],[15,6],[16,4],[16,8],[17,5],[17,6],[17,7],[18,6],
    [21,3],[21,4],[21,5],[22,3],[22,4],[22,5],[23,2],[23,6],[25,1],[25,2],[25,6],[25,7],
    [35,3],[35,4],[36,3],[36,4]
  ]
};

function resetGrid() {
  cols = Math.floor(c.width/CELL); rows = Math.floor(c.height/CELL);
  g = Array(rows).fill().map(()=>Array(cols).fill(0));
  gen = 0; updateStats();
}

function placePreset(name) {
  resetGrid();
  const p = PRESETS[name]; if(!p) return;
  // Auto-Zoom: Wenn Struktur breit ist, CELL kleiner machen
  const maxX = Math.max(...p.map(pt=>pt[0])), maxY = Math.max(...p.map(pt=>pt[1]));
  if(maxX > 40 || maxY > 30) CELL = 4; else CELL = 8;
  resetGrid();

  const ox = Math.floor(cols/2 - maxX/2), oy = Math.floor(rows/2 - maxY/2);
  p.forEach(([x,y]) => { if(g[oy+y]?.[ox+x]!==undefined) g[oy+y][ox+x]=1; });
  draw();
}

function neighbors(x,y){
  let cnt=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    cnt += g[y+dy]?.[x+dx]||0;
  }
  return cnt;
}

function step(){
  let next = g.map((r,y)=>r.map((v,x)=>{
    const n = neighbors(x,y);
    return n==3||v&&n==2? 1:0;
  }));
  g = next; gen++; updateStats();
}

function pandemic() {
  // Killt 30% der lebenden Zellen zufällig
  g = g.map(r=>r.map(v=> v && Math.random()<0.3? 0 : v));
  updateStats(); draw();
}

function countAlive() {
  return g.reduce((sum,row)=>sum+row.reduce((s,v)=>s+v,0),0);
}

function updateStats() {
  document.getElementById('stats').textContent = `Gen: ${gen} | Lebend: ${countAlive()}`;
}

function draw(){
  ctx.fillStyle='#111'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#0f8';
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      if(g[y][x]) ctx.fillRect(x*CELL,y*CELL,CELL-1,CELL-1);
    }
  }
  updateStats();
}

function loop(){
  if(running) step();
  draw();
  requestAnimationFrame(loop);
}

// UI Events
document.getElementById('play').onclick = () => {
  running =!running;
  document.getElementById('play').textContent = running?'Pause':'Start';
};
document.getElementById('step').onclick = () => { running=false; step(); draw(); };
document.getElementById('clear').onclick = () => { running=false; resetGrid(); draw(); };
document.getElementById('random').onclick = () => {
  resetGrid();
  g = g.map(r=>r.map(()=>Math.random()<0.2?1:0));
  draw();
};
document.getElementById('pandemic').onclick = pandemic;
document.getElementById('presets').onchange = e => { if(e.target.value) placePreset(e.target.value); };

// Maus zum Malen
let drawing = false;
c.onmousedown = e => { drawing=true; paint(e); };
c.onmouseup = () => drawing=false;
c.onmousemove = e => { if(drawing) paint(e); };
function paint(e){
  const x=Math.floor(e.offsetX/CELL), y=Math.floor(e.offsetY/CELL);
  if(g[y]?.[x]!==undefined){ g[y][x]=1; draw(); }
}

resetGrid(); loop();
</script>
</body>
</html>
